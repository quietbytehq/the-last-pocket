name: Linux checks and export
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install verified Godot 4.7.2 and templates
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl -fL "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o Godot_v4.7.2-stable_linux.x86_64.zip
          curl -fL "$base/Godot_v4.7.2-stable_export_templates.tpz" -o Godot_v4.7.2-stable_export_templates.tpz
          curl -fL "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          sha512sum --check --ignore-missing SHA512-SUMS.txt
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/godot/export_templates"
          install -m755 Godot_v4.7.2-stable_linux.x86_64 "$HOME/.local/bin/godot"
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d /tmp/godot-templates
          mv /tmp/godot-templates/templates "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run isolated source checks
        run: tools/test.sh
      - name: Export Linux x86-64
        run: tools/build-linux.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: TheLastPocket-linux-x86_64
          path: build/TheLastPocket/
